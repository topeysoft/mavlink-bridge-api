device:
  name: YardRover
  hostname: yardrover-dev
network:
  wifi:
    auto_connect: true
  ap:
    enabled: true
    ssid: YardRover-Setup
    password: yardrover123
  mdns:
    enabled: true
serial:
  port: /dev/cu.usbmodem2101
  baudrate: 115200
  timeout: 1.0
storage:
  base_path: /Volumes/dev/yardrover-api-python/dev-storage
  resources_path: /Volumes/dev/yardrover-api-python/dev-storage/resources
rtcm:
  enabled: false
  source:
    port: 2101
  output_to_fc: true
tls:
  enabled: false
  port: 443
security:
  enabled: true
  setup_completed: true
  require_auth_during_setup: false
  jwt_algorithm: HS256
  access_token_expire_minutes: 15
  session_timeout_minutes: 10080
  session_timeout_warning_minutes: 5
  api_key_header: X-API-Key
  allow_anonymous_health: true
  allow_anonymous_docs: false
  rate_limit_enabled: true
  rate_limit_requests: 100
  rate_limit_window_seconds: 60
  cors_origins:
  - '*'
