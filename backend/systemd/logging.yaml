# YardRover API - Logging Configuration
# Used by uvicorn --log-config option

version: 1
disable_existing_loggers: false

formatters:
  default:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  json:
    format: '{"time":"%(asctime)s","name":"%(name)s","level":"%(levelname)s","message":"%(message)s"}'
    datefmt: '%Y-%m-%dT%H:%M:%S'

  access:
    format: '%(asctime)s - %(client_addr)s - "%(request_line)s" %(status_code)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: /var/log/yardrover/api.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: json
    filename: /var/log/yardrover/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  access_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: access
    filename: /var/log/yardrover/access.log
    maxBytes: 10485760  # 10MB
    backupCount: 3
    encoding: utf8

loggers:
  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: no

  uvicorn.error:
    level: INFO
    handlers: [console, error_file]
    propagate: no

  uvicorn.access:
    level: INFO
    handlers: [access_file]
    propagate: no

  yardrover:
    level: INFO
    handlers: [console, file]
    propagate: no

  yardrover.mavlink:
    level: INFO
    handlers: [console, file]
    propagate: no

  yardrover.network:
    level: INFO
    handlers: [console, file]
    propagate: no

  yardrover.rtcm:
    level: INFO
    handlers: [console, file]
    propagate: no

root:
  level: INFO
  handlers: [console, file, error_file]
