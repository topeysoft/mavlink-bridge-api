          items:
            type: string
          description: Array of deleted mission IDs (for incremental sync)
        version:
          type: integer
          format: int64
          description: Current server version timestamp
        count:
          type: integer
          description: Number of missions returned

    MissionOperationResponse:
      type: object
      required:
        - id
