    UARTStatistics:
      type: object
      properties:
        connected:
          type: boolean
        bytesReceived:
          type: integer
        bytesSent:
          type: integer
        errorCount:
          type: integer
        overrunErrors:
          type: integer
        frameErrors:
          type: integer
        parityErrors:
          type: integer

    MAVLinkStatistics:
      type: object
      properties:
        messagesReceived:
          type: integer
        messagesSent:
          type: integer
        parseErrors:
          type: integer
        sequenceErrors:
          type: integer
        crcErrors:
          type: integer
        lastMessageId:
          type: integer
        lastSystemId:
          type: integer
        lastComponentId:
          type: integer

    # RTCM Output Schemas
    RTCMOutputConfig:
      type: object
      properties:
        mavlink:
          type: boolean
          description: Send RTCM data via MAVLink
        serial:
          type: boolean
          description: Send RTCM data via serial
        websocket:
          type: boolean
          description: Send RTCM data via WebSocket

    # mDNS Schemas
    MDNSStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether mDNS is enabled
        hostname:
          type: string
          description: mDNS hostname
        advertisedServices:
          type: array
          items:
            $ref: '#/components/schemas/MDNSService'
          description: Services being advertised
        discoveredServices:
          type: array
          items:
            $ref: '#/components/schemas/MDNSService'
          description: Discovered services

    MDNSService:
      type: object
      properties:
        name:
          type: string
          description: Service name
        serviceName:
          type: string
          description: Service instance name
        serviceType:
          type: string
          description: Service type (e.g., "rtk-base" for RTCM base stations)
        port:
          type: integer
          description: Service port
        hostname:
          type: string
          description: Hostname
        ip:
          type: string
          format: ipv4
          description: IP address
        txtRecords:
          type: string
          description: TXT records

    MDNSConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: Enable/disable mDNS
        hostname:
          type: string
          description: mDNS hostname
        services:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              port:
                type: integer
              txtRecords:
                type: string

    # Health & System Schemas
    SystemStatus:
      type: object
      properties:
        status:
          type: string
          enum: [running, degraded, error]
        stage:
          type: string
          description: Current system stage/phase
        uptime:
          type: integer
          description: System uptime in seconds
        freeHeap:
          type: integer
          description: Free heap memory in bytes
        storage:
          type: object
          properties:
            total:
              type: integer
            used:
              type: integer
            free:
              type: integer

    DetailedSystemHealth:
      type: object
      properties:
        overall:
          type: string
          enum: [healthy, degraded, critical]
        cpu:
          type: object
          properties:
            usage:
              type: number
              format: float
            temperature:
              type: number
              format: float
        memory:
          type: object
          properties:
            freeHeap:
              type: integer
            minFreeHeap:
              type: integer
            largestFreeBlock:
              type: integer
            lowMemoryWarning:
              type: boolean
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'

    HealthCheckResult:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        passed:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              passed:
                type: boolean
              message:
                type: string

    MemoryInfo:
      type: object
      properties:
        freeHeap:
          type: integer
          description: Current free heap
        minFreeHeap:
          type: integer
          description: Minimum free heap ever recorded
        largestFreeBlock:
          type: integer
          description: Largest contiguous free block
        totalHeap:
          type: integer
          description: Total heap size
        usedHeap:
          type: integer
          description: Used heap
        fragmentation:
          type: number
          format: float
          description: Heap fragmentation percentage

    ErrorEntry:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        severity:
          type: string
          enum: [error, warning, critical]
        component:
          type: string
          description: Component that generated the error
        message:
          type: string
          description: Error message
        code:
          type: string
          description: Error code

    TaskInfo:
      type: object
      properties:
        name:
          type: string
          description: Task name
        priority:
          type: integer
          description: Task priority
        stackHighWaterMark:
          type: integer
          description: Minimum free stack space
        state:
          type: string
          enum: [running, ready, blocked, suspended, deleted]
          description: Current task state
