        id:
          type: string
          description: Unique task identifier (UUID)
        name:
          type: string
          description: Human-readable task name
        description:
          type: string
          description: Task description
        type:
          type: string
          enum:
            [
              waypoint_mission,
              mowing,
              spraying,
              leaf_blowing,
              towing,
              snow_removal,
              patrolling,
              surveying,
              custom,
            ]
          description: Task type
        status:
          type: string
          enum:
            [created, ready, executing, paused, completed, failed, cancelled]
          description: Current task status
        priority:
          type: string
          enum: [low, normal, high, critical]
          description: Task priority
        createdTime:
          type: integer
          format: int64
          description: Creation timestamp (milliseconds)
        modifiedTime:
          type: integer
          format: int64
          description: Last modification timestamp (milliseconds)
        executionStartTime:
          type: integer
          format: int64
          description: Execution start timestamp (milliseconds)
        executionEndTime:
          type: integer
          format: int64
          description: Execution end timestamp (milliseconds)
        createdBy:
          type: string
          description: User or system that created the task
        version:
          type: integer
          description: Task version number
        estimatedDuration:
          type: integer
          description: Estimated duration in seconds

    TaskResponse:
      type: object
      required:
        - metadata
        - parameters
        - waypoints
      properties:
        metadata:
          $ref: '#/components/schemas/TaskMetadata'
        parameters:
          $ref: '#/components/schemas/TaskParameters'
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/TaskWaypoint'
          description: Array of task waypoints
        compressionRatio:
          type: number
          description: Storage compression ratio (0.0-1.0)
        totalDistance:
          type: number
          description: Total distance in meters
        estimatedTime:
          type: integer
          description: Estimated execution time in seconds

    TaskCreateRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: Task name
        description:
          type: string
          description: Task description
        type:
          type: string
          enum:
            [
              waypoint_mission,
              mowing,
              spraying,
              leaf_blowing,
              towing,
              snow_removal,
              patrolling,
              surveying,
              custom,
            ]
          description: Task type
        priority:
          type: string
          enum: [low, normal, high, critical]
          default: normal
          description: Task priority
        parameters:
          $ref: '#/components/schemas/TaskParameters'
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/TaskWaypoint'
          description: Array of task waypoints

    TaskUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Task name
        description:
          type: string
          description: Task description
        priority:
          type: string
          enum: [low, normal, high, critical]
          description: Task priority
        parameters:
          $ref: '#/components/schemas/TaskParameters'
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/TaskWaypoint'
          description: Array of task waypoints

    TaskListResponse:
      type: object
      required:
        - tasks
        - totalCount
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
          description: Array of tasks
        totalCount:
          type: integer
          description: Total number of tasks
        filteredCount:
          type: integer
          description: Number of tasks after filtering

    TaskExecutionRequest:
      type: object
      properties:
        validateBeforeExecution:
          type: boolean
          default: true
