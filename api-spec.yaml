          type: array
          items:
            type: string
          description: Array of deleted zone IDs (for incremental sync)
        version:
          type: integer
          format: int64
          description: Current server version timestamp
        count:
          type: integer
          description: Number of zones returned

    ZoneOperationResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: Zone identifier
        status:
          type: string
          enum: [queued, success]
          description: Operation status

    ScheduledMission:
      type: object
      required:
        - id
        - name
        - type
        - zoneIds
        - schedule
        - created
        - lastModified
      properties:
        id:
          type: string
          description: Unique mission identifier (UUID)
        name:
          type: string
          description: Mission name
        type:
          type: string
          enum: [once, daily, weekly, monthly]
          description: Mission schedule type
        zoneIds:
          type: array
          items:
            type: string
          description: Array of zone IDs to execute in order
        schedule:
          type: object
          properties:
            startTime:
              type: string
              format: date-time
              description: Scheduled start time (ISO 8601)
            endTime:
              type: string
              format: date-time
              description: Optional end time for recurring missions
            daysOfWeek:
              type: array
              items:
                type: integer
                minimum: 0
                maximum: 6
              description: Days of week (0=Sunday, 6=Saturday) for weekly missions
            dayOfMonth:
              type: integer
              minimum: 1
              maximum: 31
              description: Day of month for monthly missions
        priority:
          type: string
          enum: [low, normal, high, critical]
          default: normal
          description: Mission priority
        enabled:
          type: boolean
          default: true
          description: Whether mission is enabled
        created:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        lastModified:
          type: string
          format: date-time
          description: Last modification timestamp (ISO 8601)
        lastRun:
          type: string
          format: date-time
          description: Last execution timestamp (ISO 8601)
        nextRun:
          type: string
          format: date-time
          description: Next scheduled execution (ISO 8601)

    MissionMetadata:
      type: object
      required:
        - id
        - version
        - timestamp
        - size
      properties:
        id:
          type: string
          description: Mission identifier
        version:
          type: integer
          description: Mission version number
        timestamp:
          type: integer
          format: int64
          description: Last modification timestamp (microseconds since epoch)
        size:
          type: integer
