          description: Template identifier
        name:
          type: string
          description: Name for the new task
        description:
          type: string
          description: Description for the new task
        parameters:
          $ref: '#/components/schemas/TaskParameters'
        templateParameters:
          type: object
          description: Template-specific parameters (e.g., area dimensions, pattern spacing)

    # Parameter Management Schemas
    ParameterRequest:
      type: object
      properties:
        parameterName:
          type: string
          maxLength: 16
          description: Parameter name (MAVLink limit of 16 characters)
        parameterIndex:
          type: integer
          minimum: 0
          description: Parameter index (alternative to name)
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID

    ParameterSetRequest:
      type: object
      required:
        - parameterName
        - value
      properties:
        parameterName:
          type: string
          maxLength: 16
          description: Parameter name (MAVLink limit of 16 characters)
        value:
          type: number
          description: Parameter value to set
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID

    ParameterListRequest:
      type: object
      properties:
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID

    ParameterResponse:
      type: object
      required:
        - success
        - operation
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        operation:
          type: string
          description: Type of operation performed
        parameterName:
          type: string
          description: Parameter name (if applicable)
        value:
          type: number
          description: Parameter value (if applicable)
        totalCount:
          type: integer
          description: Total parameter count (for list operations)
        index:
          type: integer
          description: Parameter index (if applicable)
        errorMessage:
          type: string
          description: Error message if operation failed
        targetSystem:
          type: integer
          description: Target system ID
        targetComponent:
          type: integer
          description: Target component ID
        bytesSent:
          type: integer
          description: Number of bytes sent in MAVLink message

    ParameterSetResponse:
      type: object
      required:
        - success
        - operation
        - parameterName
        - value
      properties:
        success:
          type: boolean
          description: Whether the set operation was successful
        operation:
          type: string
          description: Always "parameter_set"
        parameterName:
          type: string
          description: Parameter name that was set
        value:
          type: number
          description: Parameter value that was set
        targetSystem:
          type: integer
          description: Target system ID
        targetComponent:
          type: integer
          description: Target component ID
        bytesSent:
          type: integer
          description: Number of bytes sent in MAVLink message

    ParameterValue:
      type: object
      required:
        - name
        - value
        - type
      properties:
        name:
          type: string
          description: Parameter name
        value:
          type: number
          description: Parameter value
        type:
          type: string
          enum: [int, float, enum, bitmask]
          description: Parameter data type
        timestamp:
          type: integer
          format: int64
          description: Timestamp when parameter was received (milliseconds)

    ParameterDefinition:
      type: object
      required:
        - name
        - displayName
        - description
        - category
        - userLevel
        - dataType
      properties:
        name:
          type: string
          description: Parameter name
        displayName:
          type: string
          description: Human-readable parameter name
        description:
          type: string
          description: Parameter description
        group:
          type: string
          description: Parameter group (from ArduPilot)
        category:
          type: string
          description: Functional category
        userLevel:
          type: string
          enum: [Standard, Advanced, Expert]
          description: Configuration complexity level
        dataType:
          type: string
          enum: [int, float, enum, bitmask]
          description: Parameter data type
        range:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
          description: Valid value range
        units:
          type: string
          description: Parameter units
        increment:
          type: number
          description: Recommended increment value
        values:
          type: object
          additionalProperties:
            type: string
          description: Enum value descriptions
        bitmask:
          type: object
          additionalProperties:
            type: string
          description: Bitmask flag descriptions
        rebootRequired:
          type: boolean
          description: Whether parameter change requires reboot
        tags:
          type: array
          items:
            type: string
          description: Parameter tags for searching/filtering

    # Resource Storage Schemas
    ResourceStorageHealth:
      type: object
      required:
        - healthy
        - freeBytes
        - usedBytes
        - totalBytes
      properties:
        healthy:
          type: boolean
          description: Whether resource storage is healthy
        initialized:
          type: boolean
          description: Whether resource storage is initialized
        freeBytes:
          type: integer
          description: Free storage space in resource partition
        usedBytes:
          type: integer
          description: Used storage space in resource partition
        totalBytes:
          type: integer
          description: Total storage space in resource partition (2MB dedicated)
        metrics:
          $ref: '#/components/schemas/ResourceStorageMetrics'

    ResourceStorageMetrics:
      type: object
      properties:
        totalWrites:
          type: integer
          description: Total number of write operations
        totalReads:
          type: integer
          description: Total number of read operations
        failedWrites:
          type: integer
          description: Number of failed write operations
        failedReads:
          type: integer
          description: Number of failed read operations
        queueDepth:
          type: integer
          description: Current write queue depth
        avgWriteLatency:
          type: integer
          description: Average write latency in milliseconds
        avgReadLatency:
          type: integer
          description: Average read latency in milliseconds
        poolUtilization:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Memory pool utilization (0.0 to 1.0)

    Zone:
      type: object
      required:
        - id
        - name
        - type
        - coordinates
        - color
        - area
        - created
        - lastModified
      properties:
        id:
          type: string
          description: Unique zone identifier (UUID)
        name:
          type: string
          description: Zone name
        type:
          type: string
          enum: [mowing, exclusion, charging]
          description: Zone type
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          description: Array of [longitude, latitude] coordinate pairs
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color code for zone visualization
        area:
          type: number
          description: Zone area in square meters
        description:
          type: string
          description: Optional zone description
        tags:
          type: array
          items:
            type: string
          description: Optional tags for categorization
        created:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        lastModified:
          type: string
          format: date-time
          description: Last modification timestamp (ISO 8601)
        settings:
          type: object
          description: Zone-specific settings (e.g., mowing height, pattern)

    ZoneMetadata:
      type: object
      required:
        - id
        - version
        - timestamp
        - size
      properties:
        id:
          type: string
          description: Zone identifier
        version:
          type: integer
          description: Zone version number
        timestamp:
          type: integer
          format: int64
          description: Last modification timestamp (microseconds since epoch)
        size:
          type: integer
          description: Zone data size in bytes

    ZoneListResponse:
      type: object
      required:
        - zones
        - version
        - count
      properties:
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneMetadata'
          description: Array of zone metadata
