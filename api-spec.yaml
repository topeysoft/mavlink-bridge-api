        autoRetryOnFailure:
          type: boolean
          default: false
          description: Automatically retry on failure
        maxRetries:
          type: integer
          default: 3
          description: Maximum number of retries
        timeoutSeconds:
          type: integer
          default: 3600
          description: Execution timeout in seconds
        targetSystem:
          type: integer
          default: 1
          description: MAVLink target system ID
        targetComponent:
          type: integer
          default: 1
          description: MAVLink target component ID

    TaskExecutionResponse:
      type: object
      required:
        - success
        - taskId
        - operation
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        taskId:
          type: string
          description: Task identifier
        operation:
          type: string
          description: Operation performed (execute, cancel, pause, resume)
        executionId:
          type: string
          description: Unique execution identifier
        message:
          type: string
          description: Human-readable status message
        errorCode:
          type: string
          description: Error code if operation failed

    TaskExecutionStatus:
      type: object
      required:
        - taskId
        - status
        - progress
      properties:
        taskId:
          type: string
          description: Task identifier
        status:
          type: string
          enum:
            [created, ready, executing, paused, completed, failed, cancelled]
          description: Current execution status
        startTime:
          type: integer
          format: int64
          description: Execution start timestamp (milliseconds)
        lastUpdateTime:
          type: integer
          format: int64
          description: Last update timestamp (milliseconds)
        currentWaypointIndex:
          type: integer
          description: Current waypoint being executed
        totalWaypoints:
          type: integer
          description: Total number of waypoints
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Execution progress (0.0 to 1.0)
        distanceRemaining:
          type: number
          description: Remaining distance in meters
        estimatedTimeRemaining:
          type: integer
          description: Estimated time remaining in seconds
        lastError:
          type: string
          description: Last error message if any

    TaskImportRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: string
          description: JSON data or base64-encoded backup data
        format:
          type: string
          enum: [json, compressed_json, binary]
          default: json
          description: Data format
        overwriteExisting:
          type: boolean
          default: false
          description: Overwrite existing tasks with same ID
        validateBeforeImport:
          type: boolean
          default: true
          description: Validate tasks before importing
        createBackupBeforeImport:
          type: boolean
          default: true
          description: Create backup before importing

    TaskImportResponse:
      type: object
      required:
        - success
        - tasksImported
        - totalTasks
      properties:
        success:
          type: boolean
          description: Whether import was successful
        tasksImported:
          type: integer
          description: Number of tasks successfully imported
        totalTasks:
          type: integer
          description: Total number of tasks in import data
        skippedTasks:
          type: integer
          description: Number of tasks skipped
        errors:
          type: array
          items:
            type: string
          description: Array of error messages
        processingTime:
          type: integer
          description: Processing time in milliseconds

    TaskExportRequest:
      type: object
      properties:
        taskIds:
          type: array
          items:
            type: string
          description: Specific task IDs to export (empty = all tasks)
        format:
          type: string
          enum: [json, compressed_json, binary]
          default: json
          description: Export format
        includeMetadata:
          type: boolean
          default: true
          description: Include task metadata
        includeWaypoints:
          type: boolean
          default: true
          description: Include waypoint data
        compressData:
          type: boolean
          default: false
          description: Compress export data
        description:
          type: string
          description: Export description

    TaskExportResponse:
      type: object
      required:
        - success
        - data
        - tasksExported
      properties:
        success:
          type: boolean
          description: Whether export was successful
        data:
          type: string
          description: Exported data (JSON string or base64 for binary)
        tasksExported:
          type: integer
          description: Number of tasks exported
        totalSize:
          type: integer
          description: Size of exported data in bytes
        compressionRatio:
          type: integer
          description: Compression ratio percentage if compression used
        processingTime:
          type: integer
          description: Processing time in milliseconds
        format:
          type: string
          description: Actual format used

    TaskTemplate:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          description: Template identifier
        name:
          type: string
          description: Template name
        description:
          type: string
          description: Template description
        type:
          type: string
          enum:
            [
              waypoint_mission,
              mowing,
              spraying,
              leaf_blowing,
              towing,
              snow_removal,
              patrolling,
              surveying,
              custom,
            ]
          description: Task type this template creates
        parameters:
          $ref: '#/components/schemas/TaskParameters'
        waypointPattern:
          type: object
          description: Pattern for generating waypoints
        previewImage:
          type: string
