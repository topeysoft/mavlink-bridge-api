openapi: 3.0.0
info:
  title: ESP32 MAVLink Bridge
  version: 1.0.0
  description: ESP32 MAVLink bridge with WebSocket support, optimized for resource constraints

servers:
  - url: http://{deviceIp}
    variables:
      deviceIp:
        default: 192.168.4.1
        description: ESP32 device IP address

paths:
  /api/health:
    get:
      summary: Enhanced health check endpoint
      description: Returns comprehensive system health information including device details, network status, and system metrics
      responses:
        '200':
          description: System health status (healthy or degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                uptime: 12345
                freeHeap: 45678
                device:
                  hostname: "yardrover-esp32"
                  name: "YardRover Device"
                  chipModel: "ESP32-S3"
                  chipRevision: 1
                  flashSize: 8388608
                  sdkVersion: "4.4.0"
                  coreCount: 2
                network:
                  macAddress: "24:6F:28:AB:CD:EF"
                  apMacAddress: "24:6F:28:AB:CD:F0"
                  wifi:
                    status: "connected"
                    ssid: "MyNetwork"
                    ip: "192.168.1.100"
                    gateway: "192.168.1.1"
                    subnet: "255.255.255.0"
                    rssi: -45
                    bssid: "AA:BB:CC:DD:EE:FF"
                    channel: 6
                  ap:
                    enabled: false
                system:
                  systemHealthy: true
                  cpuUsage: 25.5
                  temperature: 45.2
                  lowMemoryWarning: false
                  minFreeHeap: 40000
                  largestFreeBlock: 32768
                  taskCount: 8
                  componentCount: 4
                  components:
                    - name: "Storage"
                      healthy: true
                      status: "healthy"
                    - name: "WiFi"
                      healthy: true
                      status: "healthy"
                config:
                  version: 1
                  isDirty: false
                storage:
                  freeBytes: 256000
                  totalBytes: 512000
                  usedBytes: 256000
                  healthy: true
  /api/config:
    get:
      summary: Get complete configuration
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'

    post:
      summary: Replace entire configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuration'
      responses:
        '200':
          description: Configuration updated
        '400':
          description: Invalid configuration

    patch:
      summary: Update specific configuration fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationPatch'
      responses:
        '200':
          description: Configuration patched
        '400':
          description: Invalid patch

  /api/wifi/connect:
    post:
      summary: Connect to WiFi network
      description: |
        Connect to a WiFi network. The network credentials are automatically saved and will be used for auto-connect on boot.
        Upon successful connection, the Access Point is disabled while maintaining dual-mode WiFi capability for AsyncWebServer compatibility.
        The device remains in WIFI_AP_STA mode but the AP interface is disconnected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WiFiCredentials'
      responses:
        '200':
          description: WiFi connection initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WiFiConnectResponse'
        '400':
          description: Invalid credentials
        '409':
          description: Already connected or connection in progress

  /api/wifi/disconnect:
    post:
      summary: Disconnect from WiFi
      responses:
        '200':
          description: WiFi disconnected

  /api/wifi/status:
    get:
      summary: Get WiFi connection status
      responses:
        '200':
          description: Current WiFi status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WiFiStatus'

  /api/wifi/scan:
    get:
      summary: Scan for available WiFi networks
      parameters:
        - in: query
          name: force
          schema:
            type: boolean
            default: false
          description: Force new scan instead of using cached results
      responses:
        '200':
          description: List of available networks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WiFiScanResult'

  /api/rtcm/start:
    post:
      summary: Start RTCM client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RTCMConfig'
      responses:
        '200':
          description: RTCM client started
        '400':
          description: Invalid configuration

  /api/rtcm/stop:
    post:
      summary: Stop RTCM client
      responses:
        '200':
          description: RTCM client stopped

  /api/mavlink/command:
    post:
      summary: Send MAVLink command to flight controller
      description: Send a MAVLink command through the bridge to the connected flight controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MAVLinkCommand'
            examples:
              arm:
                summary: Arm the vehicle
                value:
                  commandType: "arm"
                  targetSystem: 1
                  targetComponent: 1
              disarm:
                summary: Disarm the vehicle
                value:
                  commandType: "disarm"
                  targetSystem: 1
                  targetComponent: 1
              setMode:
                summary: Set flight mode
                value:
                  commandType: "setMode"
                  targetSystem: 1
                  targetComponent: 1
                  customMode: 4
                  baseMode: 1
              commandLong:
                summary: Send generic command_long
                value:
                  commandType: "commandLong"
                  targetSystem: 1
                  targetComponent: 1
                  command: 400
                  param1: 1.0
      responses:
        '200':
          description: Command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MAVLinkCommandResponse'
        '400':
          description: Invalid command parameters

  /api/mavlink/mission/upload:
    post:
      summary: Upload mission plan to flight controller
      description: Upload a complete mission plan with waypoints to the flight controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionUploadRequest'
      responses:
        '200':
          description: Mission upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionOperationResult'
        '400':
          description: Invalid mission data

  /api/mavlink/mission/download:
    post:
      summary: Download mission plan from flight controller
      description: Download the current mission plan from the flight controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionDownloadRequest'
      responses:
        '200':
          description: Mission download result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPlan'

  /api/mavlink/mission/clear:
    post:
      summary: Clear all mission items from flight controller
      description: Remove all mission items from the flight controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionClearRequest'
      responses:
        '200':
          description: Mission clear result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionOperationResult'

  /api/mavlink/mission/set_current:
    post:
      summary: Set current mission item
      description: Set the current mission item sequence number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionSetCurrentRequest'
      responses:
        '200':
          description: Set current item result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionOperationResult'

  /api/mavlink/mission/status:
    post:
      summary: Get mission status
      description: Get current mission status and progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionStatusRequest'
      responses:
        '200':
          description: Mission status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionStatus'

  /api/mavlink/parameters/stream:
    get:
      summary: Parameter streaming endpoint (SSE)
      description: |
        Server-Sent Events endpoint for real-time parameter streaming.
        Provides CORS-enabled parameter updates without overwhelming WebSocket connections.
      responses:
        '200':
          description: SSE parameter stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events stream with parameter data
              examples:
                connected:
                  summary: Connection established
                  value: 'data: {"type":"connected","timestamp":1629123456789}'
                parameter_value:
                  summary: Parameter value received
                  value: 'data: {"type":"parameter_value","parameterName":"AHRS_GPS_GAIN","value":1.0,"timestamp":1629123456789}'

  /api/mavlink/parameters/request:
    post:
      summary: Request specific parameter
      description: Request a parameter by name or index from the flight controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterRequest'
            examples:
              by_name:
                summary: Request parameter by name
                value:
                  parameterName: "AHRS_GPS_GAIN"
                  targetSystem: 1
                  targetComponent: 1
              by_index:
                summary: Request parameter by index
                value:
                  parameterIndex: 42
                  targetSystem: 1
                  targetComponent: 1
      responses:
        '200':
          description: Parameter request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterResponse'
        '400':
          description: Invalid request parameters

  /api/mavlink/parameters/set:
    post:
      summary: Set parameter value
      description: Set a parameter value on the flight controller with validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterSetRequest'
            example:
              parameterName: "AHRS_GPS_GAIN"
              value: 1.5
              targetSystem: 1
              targetComponent: 1
      responses:
        '200':
          description: Parameter set request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterSetResponse'
        '400':
          description: Invalid parameter or validation failed

  /api/mavlink/parameters/list:
    post:
      summary: Request parameter list
      description: Request the complete parameter list from the flight controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterListRequest'
            example:
              targetSystem: 1
              targetComponent: 1
      responses:
        '200':
          description: Parameter list request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterResponse'
        '400':
          description: Invalid request parameters

  /api/zones:
    get:
      summary: List all zones
      description: Retrieve metadata for all zones with optional incremental sync support
      parameters:
        - name: since
          in: query
          description: Timestamp for incremental sync (microseconds since boot)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of zones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponse'
        '500':
          description: Storage not initialized or internal error

    post:
      summary: Create a new zone
      description: |
        Create a new zone resource. The write operation is queued and processed asynchronously.
        Returns 202 (Accepted) to indicate the operation is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zone'
      responses:
        '202':
          description: Zone creation queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneOperationResponse'
        '400':
          description: Invalid zone data or missing ID
        '500':
          description: Storage not initialized or internal error
        '503':
          description: Write queue full, try again later

  /api/zones/{zoneId}:
    get:
      summary: Get zone details
      description: Retrieve complete zone data by ID
      parameters:
        - name: zoneId
          in: path
          required: true
          description: Unique zone identifier (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Zone data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '404':
          description: Zone not found
        '500':
          description: Storage not initialized or read error

    put:
      summary: Update zone
      description: |
        Update an existing zone. The write operation is queued and processed asynchronously.
        Returns 202 (Accepted) to indicate the operation is queued.
      parameters:
        - name: zoneId
          in: path
          required: true
          description: Unique zone identifier (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zone'
      responses:
        '202':
          description: Zone update queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneOperationResponse'
        '400':
          description: Invalid zone data
        '404':
          description: Zone not found
        '500':
          description: Storage not initialized or internal error

    delete:
      summary: Delete zone
      description: Delete a zone resource
      parameters:
        - name: zoneId
          in: path
          required: true
          description: Unique zone identifier (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Zone deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneOperationResponse'
        '404':
          description: Zone not found
        '500':
          description: Storage not initialized or internal error

  /api/missions:
    get:
      summary: List all missions
      description: Retrieve metadata for all missions with optional incremental sync support
      parameters:
        - name: since
          in: query
          description: Timestamp for incremental sync (microseconds since boot)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of missions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionListResponse'
        '500':
          description: Storage not initialized or internal error

    post:
      summary: Create a new mission
      description: |
        Create a new scheduled mission resource. The write operation is queued and processed asynchronously.
        Returns 202 (Accepted) to indicate the operation is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledMission'
      responses:
        '202':
          description: Mission creation queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionOperationResponse'
        '400':
          description: Invalid mission data or missing ID
        '500':
          description: Storage not initialized or internal error
        '503':
          description: Write queue full, try again later

  /api/missions/{missionId}:
    get:
      summary: Get mission details
      description: Retrieve complete mission data by ID
      parameters:
        - name: missionId
          in: path
          required: true
          description: Unique mission identifier (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Mission data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledMission'
        '404':
          description: Mission not found
        '500':
          description: Storage not initialized or read error

    put:
      summary: Update mission
      description: |
        Update an existing mission. The write operation is queued and processed asynchronously.
        Returns 202 (Accepted) to indicate the operation is queued.
      parameters:
        - name: missionId
          in: path
          required: true
          description: Unique mission identifier (UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledMission'
      responses:
        '202':
          description: Mission update queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionOperationResponse'
        '400':
          description: Invalid mission data
        '404':
          description: Mission not found
        '500':
          description: Storage not initialized or internal error

    delete:
      summary: Delete mission
      description: Delete a mission resource
      parameters:
        - name: missionId
          in: path
          required: true
          description: Unique mission identifier (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Mission deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionOperationResponse'
        '404':
          description: Mission not found
        '500':
          description: Storage not initialized or internal error

  /api/resources/sync:
    get:
      summary: Get resource sync metadata
      description: |
        Retrieve metadata about all zones and missions for synchronization purposes.
        Includes resource counts, server timestamp, and storage statistics.
      responses:
        '200':
          description: Sync metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSyncResponse'
        '500':
          description: Storage not initialized or internal error

  /ws:
    get:
      summary: WebSocket endpoint for real-time communication
      description: |
        WebSocket connection for real-time events and data streaming.
        Message format: JSON with 'type' and 'payload' fields.

        Resource-related events:
        - zone:created: Zone was created
        - zone:updated: Zone was modified
        - zone:deleted: Zone was deleted
        - mission:created: Mission was created
        - mission:updated: Mission was modified
        - mission:deleted: Mission was deleted

        Other events:
        - status: System status update
        - config_changed: Configuration was modified
        - rtcm_data: RTCM correction data received
        - error: Error occurred
        - log: System log message
        - mavlink_message: MAVLink message received
      responses:
        '101':
          description: Switching Protocols

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - uptime
        - freeHeap
        - device
        - network
        - config
        - storage
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        uptime:
          type: integer
          description: Uptime in seconds
        freeHeap:
          type: integer
          description: Free heap memory in bytes
        device:
          $ref: '#/components/schemas/DeviceInfo'
        network:
          $ref: '#/components/schemas/NetworkInfo'
        system:
          $ref: '#/components/schemas/SystemHealth'
          description: System health information (only present when HealthMonitor is available)
        config:
          $ref: '#/components/schemas/ConfigHealth'
        storage:
          $ref: '#/components/schemas/StorageHealth'
        resourceStorage:
          $ref: '#/components/schemas/ResourceStorageHealth'
          description: Resource storage health (zones/missions storage subsystem)
        issues:
          type: array
          items:
            type: string
            enum: [system_unhealthy, low_storage, low_memory]
          description: Issues causing degraded status (only present when status is degraded)

    DeviceInfo:
      type: object
      required:
        - hostname
        - name
        - chipModel
        - chipRevision
        - flashSize
        - sdkVersion
        - coreCount
      properties:
        hostname:
          type: string
          description: Device hostname
        name:
          type: string
          description: Device name from configuration
        chipModel:
          type: string
          description: ESP32 chip model
        chipRevision:
          type: integer
          description: Chip revision number
        flashSize:
          type: integer
          description: Flash memory size in bytes
        sdkVersion:
          type: string
          description: ESP-IDF SDK version
        coreCount:
          type: integer
          description: Number of CPU cores

    NetworkInfo:
      type: object
      required:
        - macAddress
        - apMacAddress
        - wifi
        - ap
      properties:
        macAddress:
          type: string
          pattern: '^([0-9A-F]{2}:){5}[0-9A-F]{2}$'
          description: WiFi station MAC address
        apMacAddress:
          type: string
          pattern: '^([0-9A-F]{2}:){5}[0-9A-F]{2}$'
          description: WiFi access point MAC address
        wifi:
          $ref: '#/components/schemas/WiFiInfo'
        ap:
          $ref: '#/components/schemas/AccessPointInfo'

    WiFiInfo:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [disconnected, connecting, connected, ap_mode, error]
          description: |
            WiFi connection status:
            - disconnected: Not connected to any network
            - connecting: Attempting to connect to a network
            - connected: Connected to WiFi network (AP interface disabled via softAPdisconnect)
            - ap_mode: Running as access point (AP active, may or may not have STA connection)
            - error: Connection error occurred

            Note: Device always runs in WIFI_AP_STA mode for AsyncWebServer compatibility,
            but AP is disabled when connected to WiFi.
        ssid:
          type: string
          description: Connected network SSID (only when connected)
        ip:
          type: string
          format: ipv4
          description: Device IP address (only when connected)
        gateway:
          type: string
          format: ipv4
          description: Gateway IP address (only when connected)
        subnet:
          type: string
          format: ipv4
          description: Subnet mask (only when connected)
        rssi:
          type: integer
          description: Signal strength in dBm (only when connected)
        bssid:
          type: string
          pattern: '^([0-9A-F]{2}:){5}[0-9A-F]{2}$'
          description: Router MAC address (only when connected)
        channel:
          type: integer
          minimum: 1
          maximum: 14
          description: WiFi channel (only when connected)

    AccessPointInfo:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether access point is active
        ip:
          type: string
          format: ipv4
          description: Access point IP address (only when enabled)
        ssid:
          type: string
          description: Access point SSID (only when enabled)
        clients:
          type: integer
          minimum: 0
          description: Number of connected clients (only when enabled)

    SystemHealth:
      type: object
      properties:
        systemHealthy:
          type: boolean
          description: Overall system health status
        cpuUsage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: CPU usage percentage
        temperature:
          type: number
          format: float
          description: System temperature in Celsius
        lowMemoryWarning:
          type: boolean
          description: Whether low memory warning is active
        minFreeHeap:
          type: integer
          description: Minimum free heap recorded in bytes
        largestFreeBlock:
          type: integer
          description: Largest free memory block in bytes
        taskCount:
          type: integer
          description: Number of running tasks
        componentCount:
          type: integer
          description: Number of monitored components
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'

    ComponentHealth:
      type: object
      required:
        - name
        - healthy
        - status
      properties:
        name:
          type: string
          description: Component name
        healthy:
          type: boolean
          description: Component health status
        status:
          type: string
          description: Component status description

    ConfigHealth:
      type: object
      required:
        - version
        - isDirty
      properties:
        version:
          type: integer
          description: Configuration version
        isDirty:
          type: boolean
          description: Whether configuration has unsaved changes

    StorageHealth:
      type: object
      required:
        - freeBytes
        - totalBytes
        - usedBytes
        - healthy
      properties:
        freeBytes:
          type: integer
          description: Free storage space in bytes
        totalBytes:
          type: integer
          description: Total storage space in bytes
        usedBytes:
          type: integer
          description: Used storage space in bytes
        healthy:
          type: boolean
          description: Whether storage is healthy

    Configuration:
      type: object
      required:
        - device
        - connection
        - rtcm
      properties:
        device:
          $ref: '#/components/schemas/DeviceConfig'
        connection:
          $ref: '#/components/schemas/ConnectionConfig'
        rtcm:
          $ref: '#/components/schemas/RTCMConfig'

    ConfigurationPatch:
      type: object
      description: JSON Patch document for granular updates
      example:
        - op: 'replace'
          path: '/device/name'
          value: 'MyESP32'

    DeviceConfig:
      type: object
      required:
        - name
        - mode
      properties:
        name:
          type: string
          maxLength: 32
        mode:
          type: string
          enum: [usb_otg, uart]
          default: usb_otg

    ConnectionConfig:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [wifi, ethernet]
        wifi:
          $ref: '#/components/schemas/WiFiConfig'

    WiFiConfig:
      type: object
      properties:
        ssid:
          type: string
          maxLength: 32
          description: SSID of saved network (if any)
        password:
          type: string
          maxLength: 64
          description: Password of saved network (if any)
        autoConnect:
          type: boolean
          default: true
          description: Automatically connect to saved network on boot
        apModeEnabled:
          type: boolean
          default: true
          description: Enable AP mode when not connected
        apSSID:
          type: string
          maxLength: 32
          default: "MAVLinkBridge-Setup"
          description: Access Point SSID
        apPassword:
          type: string
          maxLength: 64
          default: "mavlinkbridge123"
          description: Access Point password

    WiFiCredentials:
      type: object
      required:
        - ssid
        - password
      properties:
        ssid:
          type: string
          maxLength: 32
        password:
          type: string
          maxLength: 64

    WiFiStatus:
      type: object
      required:
        - state
        - connected
      properties:
        state:
          type: string
          enum: [disconnected, connecting, connected, ap_mode, error]
          description: Current WiFi state
        connected:
          type: boolean
          description: Whether WiFi is connected
        ssid:
          type: string
          description: Connected network SSID (when connected)
        ip:
          type: string
          format: ipv4
          description: Device IP address (when connected)
        gateway:
          type: string
          format: ipv4
          description: Gateway IP address (when connected)
        subnet:
          type: string
          format: ipv4
          description: Subnet mask (when connected)
        rssi:
          type: integer
          description: Signal strength in dBm (when connected)
        quality:
          type: integer
          minimum: 0
          maximum: 100
          description: Signal quality percentage (when connected)
        bssid:
          type: string
          pattern: '^([0-9A-F]{2}:){5}[0-9A-F]{2}$'
          description: Router MAC address (when connected)
        apMode:
          type: boolean
          description: Whether device is in AP mode
        apIP:
          type: string
          format: ipv4
          description: Access Point IP address (when in AP mode)
        apSSID:
          type: string
          description: Access Point SSID (when in AP mode)
        connectedClients:
          type: integer
          description: Number of connected clients (when in AP mode)

    WiFiScanResult:
      type: object
      required:
        - networks
        - count
        - cached
      properties:
        networks:
          type: array
          items:
            $ref: '#/components/schemas/WiFiNetwork'
        count:
          type: integer
          description: Number of networks found
        cached:
          type: boolean
          description: Whether results are from cache

    WiFiNetwork:
      type: object
      required:
        - ssid
        - rssi
        - secure
        - authMode
        - channel
      properties:
        ssid:
          type: string
          description: Network SSID
        rssi:
          type: integer
          description: Signal strength in dBm
        secure:
          type: boolean
          description: Whether network is password protected
        authMode:
          type: string
          enum: [open, wep, wpa, wpa2, wpa/wpa2, wpa2-enterprise, wpa3, wpa2/wpa3]
          description: Authentication mode
        channel:
          type: integer
          minimum: 1
          maximum: 14
          description: WiFi channel
        quality:
          type: integer
          minimum: 0
          maximum: 100
          description: Signal quality percentage

    WiFiConnectResponse:
      type: object
      required:
        - ssid
        - state
        - message
      properties:
        ssid:
          type: string
          description: SSID being connected to
        state:
          type: string
          enum: [connecting]
          description: Connection state
        message:
          type: string
          description: Status message

    RTCMConfig:
      type: object
      required:
        - enabled
        - source
      properties:
        enabled:
          type: boolean
        source:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [ntrip, tcp, udp]
            host:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            mountpoint:
              type: string
              description: NTRIP mountpoint (required for NTRIP)
            username:
              type: string
              description: NTRIP username (optional)
            password:
              type: string
              description: NTRIP password (optional)

    WebSocketMessage:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum: [status, config_changed, rtcm_data, error, log, mavlink_message]
        payload:
          type: object
          description: Event-specific payload

    MAVLinkCommand:
      type: object
      required:
        - commandType
      properties:
        commandType:
          type: string
          enum: [arm, disarm, setMode, commandLong, commandInt, setPositionTarget]
          description: Type of MAVLink command to send
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID
        customMode:
          type: integer
          description: Custom mode for setMode command
        baseMode:
          type: integer
          description: Base mode for setMode command
        command:
          type: integer
          description: MAVLink command ID for commandLong/commandInt
        frame:
          type: integer
          description: Coordinate frame for commandInt
        current:
          type: integer
          description: Current waypoint for commandInt
        autocontinue:
          type: integer
          description: Autocontinue flag for commandInt
        param1:
          type: number
          description: Command parameter 1
        param2:
          type: number
          description: Command parameter 2
        param3:
          type: number
          description: Command parameter 3
        param4:
          type: number
          description: Command parameter 4
        param5:
          type: number
          description: Command parameter 5
        param6:
          type: number
          description: Command parameter 6
        param7:
          type: number
          description: Command parameter 7
        x:
          type: integer
          description: X coordinate for commandInt
        y:
          type: integer
          description: Y coordinate for commandInt
        z:
          type: number
          description: Z coordinate
        timeBootMs:
          type: integer
          description: Timestamp for position target commands
        coordinateFrame:
          type: integer
          description: Coordinate frame for position commands
        typeMask:
          type: integer
          description: Type mask for position commands
        vx:
          type: number
          description: X velocity
        vy:
          type: number
          description: Y velocity
        vz:
          type: number
          description: Z velocity
        afx:
          type: number
          description: X acceleration
        afy:
          type: number
          description: Y acceleration
        afz:
          type: number
          description: Z acceleration
        yaw:
          type: number
          description: Yaw angle
        yawRate:
          type: number
          description: Yaw rate

    MAVLinkCommandResponse:
      type: object
      required:
        - success
        - commandType
        - messageId
        - bytesSent
      properties:
        success:
          type: boolean
          description: Whether the command was sent successfully
        commandType:
          type: string
          description: Type of command that was sent
        targetSystem:
          type: integer
          description: Target system ID
        targetComponent:
          type: integer
          description: Target component ID
        messageId:
          type: integer
          description: MAVLink message ID that was sent
        bytesSent:
          type: integer
          description: Number of bytes sent

    MissionItem:
      type: object
      required:
        - seq
        - frame
        - command
        - current
        - autocontinue
        - param1
        - param2
        - param3
        - param4
        - x
        - y
        - z
      properties:
        seq:
          type: integer
          description: Sequence number of the mission item
        frame:
          type: integer
          description: Coordinate frame (MAVFrame enum)
        command:
          type: integer
          description: MAVLink command ID
        current:
          type: integer
          description: Whether this is the current mission item (0 or 1)
        autocontinue:
          type: integer
          description: Whether to continue to next item automatically (0 or 1)
        param1:
          type: number
          description: Command parameter 1
        param2:
          type: number
          description: Command parameter 2
        param3:
          type: number
          description: Command parameter 3
        param4:
          type: number
          description: Command parameter 4
        x:
          type: integer
          description: X coordinate (latitude * 1e7 for global coordinates)
        y:
          type: integer
          description: Y coordinate (longitude * 1e7 for global coordinates)
        z:
          type: number
          description: Z coordinate (altitude)
        missionType:
          type: integer
          description: Mission type (MAVMissionType enum)

    MissionUploadRequest:
      type: object
      required:
        - items
      properties:
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID
        missionType:
          type: integer
          default: 0
          description: Mission type (0=mission, 1=fence, 2=rally)
        items:
          type: array
          items:
            $ref: '#/components/schemas/MissionItem'
          description: Array of mission items to upload

    MissionDownloadRequest:
      type: object
      properties:
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID
        missionType:
          type: integer
          default: 0
          description: Mission type (0=mission, 1=fence, 2=rally)

    MissionClearRequest:
      type: object
      properties:
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID
        missionType:
          type: integer
          default: 0
          description: Mission type (0=mission, 1=fence, 2=rally)

    MissionSetCurrentRequest:
      type: object
      required:
        - seq
      properties:
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID
        seq:
          type: integer
          minimum: 0
          description: Sequence number of mission item to set as current

    MissionStatusRequest:
      type: object
      properties:
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID

    MissionPlan:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MissionItem'
          description: Array of mission items
        targetSystem:
          type: integer
          description: Target system ID
        targetComponent:
          type: integer
          description: Target component ID

    MissionOperationResult:
      type: object
      required:
        - success
        - operation
        - targetSystem
        - targetComponent
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        operation:
          type: string
          description: Type of operation performed
        itemsProcessed:
          type: integer
          description: Number of items processed
        totalItems:
          type: integer
          description: Total number of items
        errorMessage:
          type: string
          description: Error message if operation failed
        targetSystem:
          type: integer
          description: Target system ID
        targetComponent:
          type: integer
          description: Target component ID

    MissionStatus:
      type: object
      required:
        - count
        - current
        - reached
        - state
      properties:
        count:
          type: integer
          description: Total number of mission items
        current:
          type: integer
          description: Current mission item sequence number
        reached:
          type: integer
          description: Last reached mission item sequence number
        state:
          type: integer
          description: Mission state (MissionState enum)

    # Resource Storage Schemas
    ResourceStorageHealth:
      type: object
      required:
        - healthy
        - queueDepth
        - freeSpace
        - usedSpace
      properties:
        healthy:
          type: boolean
          description: Whether resource storage is healthy
        queueDepth:
          type: integer
          description: Number of pending write operations
        freeSpace:
          type: integer
          description: Free storage space in bytes
        usedSpace:
          type: integer
          description: Used storage space in bytes
        totalWrites:
          type: integer
          description: Total number of write operations
        totalReads:
          type: integer
          description: Total number of read operations
        failedWrites:
          type: integer
          description: Number of failed write operations
        failedReads:
          type: integer
          description: Number of failed read operations

    ResourceStorageMetrics:
      type: object
      required:
        - totalWrites
        - totalReads
        - queuedWrites
        - freeSpace
        - usedSpace
      properties:
        totalWrites:
          type: integer
          description: Total write operations performed
        totalReads:
          type: integer
          description: Total read operations performed
        failedWrites:
          type: integer
          description: Failed write operations
        failedReads:
          type: integer
          description: Failed read operations
        queuedWrites:
          type: integer
          description: Currently queued write operations
        avgWriteLatency:
          type: integer
          description: Average write latency in microseconds
        avgReadLatency:
          type: integer
          description: Average read latency in microseconds
        poolUtilization:
          type: number
          description: Resource pool utilization percentage
        freeSpace:
          type: integer
          description: Free storage space in bytes
        usedSpace:
          type: integer
          description: Used storage space in bytes

    Zone:
      type: object
      required:
        - id
        - name
        - type
        - boundary
      properties:
        id:
          type: string
          description: Unique zone identifier (UUID)
        name:
          type: string
          description: Zone name
        description:
          type: string
          description: Zone description
        type:
          type: string
          enum: [inclusion, exclusion, geofence]
          description: Zone type
        boundary:
          type: array
          items:
            type: object
            required:
              - lat
              - lng
            properties:
              lat:
                type: number
                format: double
                description: Latitude in degrees
              lng:
                type: number
                format: double
                description: Longitude in degrees
          description: Zone boundary coordinates (polygon)
        metadata:
          $ref: '#/components/schemas/ZoneMetadata'

    ZoneMetadata:
      type: object
      properties:
        version:
          type: integer
          description: Zone version number
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp (microseconds)
        updatedAt:
          type: integer
          format: int64
          description: Last update timestamp (microseconds)
        tags:
          type: array
          items:
            type: string
          description: Zone tags for categorization
        color:
          type: string
          description: Display color (hex format)

    ZoneListResponse:
      type: object
      required:
        - zones
        - count
        - version
      properties:
        zones:
          type: array
          items:
            type: object
            required:
              - id
              - version
              - timestamp
              - size
            properties:
              id:
                type: string
                description: Zone identifier
              version:
                type: integer
                description: Zone version
              timestamp:
                type: integer
                format: int64
                description: Last modification timestamp (microseconds)
              size:
                type: integer
                description: Zone data size in bytes
          description: Array of zone metadata
        deleted:
          type: array
          items:
            type: string
          description: IDs of deleted zones (for incremental sync)
        count:
          type: integer
          description: Number of zones returned
        version:
          type: integer
          format: int64
          description: Server version timestamp (microseconds)

    ZoneOperationResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: Zone identifier
        status:
          type: string
          enum: [queued, deleted]
          description: Operation status

    ScheduledMission:
      type: object
      required:
        - id
        - name
        - zoneId
        - waypoints
      properties:
        id:
          type: string
          description: Unique mission identifier (UUID)
        name:
          type: string
          description: Mission name
        description:
          type: string
          description: Mission description
        zoneId:
          type: string
          description: Associated zone ID
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/MissionItem'
          description: Mission waypoints
        schedule:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether scheduling is enabled
            startTime:
              type: integer
              format: int64
              description: Scheduled start time (Unix timestamp)
            recurrence:
              type: string
              enum: [once, daily, weekly, monthly]
              description: Recurrence pattern
        metadata:
          $ref: '#/components/schemas/MissionMetadata'

    MissionMetadata:
      type: object
      properties:
        version:
          type: integer
          description: Mission version number
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp (microseconds)
        updatedAt:
          type: integer
          format: int64
          description: Last update timestamp (microseconds)
        lastExecuted:
          type: integer
          format: int64
          description: Last execution timestamp (microseconds)
        executionCount:
          type: integer
          description: Number of times executed
        tags:
          type: array
          items:
            type: string
          description: Mission tags for categorization

    MissionListResponse:
      type: object
      required:
        - missions
        - count
        - version
      properties:
        missions:
          type: array
          items:
            type: object
            required:
              - id
              - version
              - timestamp
              - size
            properties:
              id:
                type: string
                description: Mission identifier
              version:
                type: integer
                description: Mission version
              timestamp:
                type: integer
                format: int64
                description: Last modification timestamp (microseconds)
              size:
                type: integer
                description: Mission data size in bytes
          description: Array of mission metadata
        count:
          type: integer
          description: Number of missions returned
        version:
          type: integer
          format: int64
          description: Server version timestamp (microseconds)

    MissionOperationResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: Mission identifier
        status:
          type: string
          enum: [queued, deleted]
          description: Operation status

    ResourceSyncResponse:
      type: object
      required:
        - zoneCount
        - missionCount
        - serverTime
        - stats
      properties:
        zoneCount:
          type: integer
          description: Total number of zones
        missionCount:
          type: integer
          description: Total number of missions
        serverTime:
          type: integer
          format: int64
          description: Server timestamp (microseconds since boot)
        stats:
          type: object
          required:
            - totalWrites
            - totalReads
            - queueDepth
            - freeSpace
            - usedSpace
          properties:
            totalWrites:
              type: integer
              description: Total write operations
            totalReads:
              type: integer
              description: Total read operations
            queueDepth:
              type: integer
              description: Pending write operations
            freeSpace:
              type: integer
              description: Free storage space in bytes
            usedSpace:
              type: integer
              description: Used storage space in bytes

    # Parameter Management Schemas
    ParameterRequest:
      type: object
      properties:
        parameterName:
          type: string
          maxLength: 16
          description: Parameter name (MAVLink limit of 16 characters)
        parameterIndex:
          type: integer
          minimum: 0
          description: Parameter index (alternative to name)
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID

    ParameterSetRequest:
      type: object
      required:
        - parameterName
        - value
      properties:
        parameterName:
          type: string
          maxLength: 16
          description: Parameter name (MAVLink limit of 16 characters)
        value:
          type: number
          description: Parameter value to set
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID

    ParameterListRequest:
      type: object
      properties:
        targetSystem:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target system ID
        targetComponent:
          type: integer
          minimum: 1
          maximum: 255
          default: 1
          description: Target component ID

    ParameterResponse:
      type: object
      required:
        - success
        - operation
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        operation:
          type: string
          description: Type of operation performed
        parameterName:
          type: string
          description: Parameter name (if applicable)
        value:
          type: number
          description: Parameter value (if applicable)
        totalCount:
          type: integer
          description: Total parameter count (for list operations)
        index:
          type: integer
          description: Parameter index (if applicable)
        errorMessage:
          type: string
          description: Error message if operation failed
        targetSystem:
          type: integer
          description: Target system ID
        targetComponent:
          type: integer
          description: Target component ID
        bytesSent:
          type: integer
          description: Number of bytes sent in MAVLink message

    ParameterSetResponse:
      type: object
      required:
        - success
        - operation
        - parameterName
        - value
      properties:
        success:
          type: boolean
          description: Whether the set operation was successful
        operation:
          type: string
          description: Always "parameter_set"
        parameterName:
          type: string
          description: Parameter name that was set
        value:
          type: number
          description: Parameter value that was set
        targetSystem:
          type: integer
          description: Target system ID
        targetComponent:
          type: integer
          description: Target component ID
        bytesSent:
          type: integer
          description: Number of bytes sent in MAVLink message

    ParameterValue:
      type: object
      required:
        - name
        - value
        - type
      properties:
        name:
          type: string
          description: Parameter name
        value:
          type: number
          description: Parameter value
        type:
          type: string
          enum: [int, float, enum, bitmask]
          description: Parameter data type
        timestamp:
          type: integer
          format: int64
          description: Timestamp when parameter was received (milliseconds)

    ParameterDefinition:
      type: object
      required:
        - name
        - displayName
        - description
        - category
        - userLevel
        - dataType
      properties:
        name:
          type: string
          description: Parameter name
        displayName:
          type: string
          description: Human-readable parameter name
        description:
          type: string
          description: Parameter description
        group:
          type: string
          description: Parameter group (from ArduPilot)
        category:
          type: string
          description: Functional category
        userLevel:
          type: string
          enum: [Standard, Advanced, Expert]
          description: Configuration complexity level
        dataType:
          type: string
          enum: [int, float, enum, bitmask]
          description: Parameter data type
        range:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
          description: Valid value range
        units:
          type: string
          description: Parameter units
        increment:
          type: number
          description: Recommended increment value
        values:
          type: object
          additionalProperties:
            type: string
          description: Enum value descriptions
        bitmask:
          type: object
          additionalProperties:
            type: string
          description: Bitmask flag descriptions
        rebootRequired:
          type: boolean
          description: Whether parameter change requires reboot
        tags:
          type: array
          items:
            type: string
          description: Parameter tags for searching/filtering
