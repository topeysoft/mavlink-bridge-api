[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
; board = esp32dev
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200

lib_deps = 
    bblanchon/ArduinoJson@^6.21.2
    esp32async/AsyncTCP@^3.4.7
    esp32async/ESPAsyncWebServer@^3.8.0
    https://github.com/mavlink/c_library_v2.git
    pstolarz/OneWireNg@^0.14.0
    WiFi

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DCONFIG_USB_HOST_ENABLED=1
    -DENABLE_USB_OTG_MAVLINK=1
    -DUSB_HOST_AVAILABLE=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUSE_LITTLEFS=1

lib_ignore = 
    WebServer
    Network

upload_speed = 921600
monitor_filters = 
    esp32_exception_decoder
    time

[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
lib_deps = ${env:esp32s3.lib_deps}

build_flags = 
    ${env:esp32s3.build_flags}
    -DBOARD_HAS_PSRAM=0

upload_speed = 921600
monitor_filters = ${env:esp32s3.monitor_filters}

[env:test]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DARDUINO_ARCH_NATIVE
    -I test/mocks
    -I lib/core/NVSManager
    -I lib/core/ConfigManager
    -I lib/core/ErrorHandler
    -I lib/core/EventManager
    -I lib/core/HealthMonitor
    -I lib/core/IntegrationTest
    -I lib/core/JsonPatch
    -I lib/core/MemoryManager
    -I lib/core/Storage
    -I lib/core/TaskManager
    -I lib/communication/USBOTGManager
    -I lib/communication/CommunicationEndpoints
    -I lib/network/MDNSManager
    -I lib/network/WiFiManager
    -I lib/network/HttpServer
    -I lib/network/WebSocketServer
    -I lib/network/ConfigEndpoints
    -I lib/network/WiFiEndpoints
    -I lib/network/MDNSEndpoints
    -I lib/mavlink/MAVLinkConverter
    -I lib/mavlink/MAVLinkProcessor
    -I lib/communication/DataRouter
    -I lib/communication/UARTManager
    -I lib/mission
    -I lib/rtcm/RTCMParser
    -I lib/rtcm/RTCMClient
    -I lib/rtcm/RTCMEndpoints
    -I lib/rtcm/NTRIPClient
    -I lib/rtcm/RTCMReceivers
    -I lib
build_src_filter = +<*> +<../test/mocks/>
lib_ldf_mode = deep+
lib_deps =
    throwtheswitch/Unity@^2.5.2
    bblanchon/ArduinoJson@^6.21.2

[env:wokwi]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
test_framework = unity
lib_deps = ${env:esp32s3.lib_deps}
build_flags = ${env:esp32s3.build_flags}
lib_ignore = ${env:esp32s3.lib_ignore}

[env:qemu]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
test_framework = unity
lib_deps = ${env:esp32s3.lib_deps}
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DCONFIG_USB_HOST_ENABLED=1
    -DENABLE_USB_OTG_MAVLINK=1
    -DUSB_HOST_AVAILABLE=1
    -DUSE_LITTLEFS=1
    -DQEMU_BUILD=1
lib_ignore = ${env:esp32s3.lib_ignore}
extra_scripts = 
    pre:scripts/qemu_pre_build.py
    post:scripts/qemu_post_build.py